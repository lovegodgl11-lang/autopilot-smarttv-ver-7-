    <script>
        const firebaseConfig = {

        // --- Global State ---
        let db;

        const nextUpListEl = document.getElementById('next-up-list');

        const tvVideoPlayer = document.getElementById('tv-video-player');

        // --- Utility Functions ---
        const getTodayDateString = () => new Date().toISOString().slice(0, 10);
        const escapeHtml = (unsafe) => {
            if (typeof unsafe !== 'string') return unsafe;
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        };
        
        // --- Core Functions ---
        function speak(tokenNumber, customerName) {
            if (isMuted || !('speechSynthesis' in window)) return;
            const wasPlaying = audioPlayer && !audioPlayer.paused;
            if (wasPlaying) audioPlayer.pause();
            speechSynthesis.cancel();
            
            const textToSpeak = `Token number ${tokenNumber}, ${customerName}, please proceed to the counter.`;
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'en-IN';
            utterance.rate = 0.9;
            utterance.onend = () => {
                if (wasPlaying) audioPlayer.play().catch(e => console.error("Audio resume failed", e));
            };
            speechSynthesis.speak(utterance);
        }

        function updateCountdown(eta) {
            if (countdownInterval) clearInterval(countdownInterval);
            if (!eta) {
                onDeckEtaContainerEl.classList.add('hidden');
                return;
            }
            onDeckEtaContainerEl.classList.remove('hidden');

            const update = () => {
                const distance = eta - (new Date().getTime() + serverTimeOffset);
                document.getElementById('light-red').classList.remove('red');
                document.getElementById('light-yellow').classList.remove('yellow');
                document.getElementById('light-green').classList.remove('green');

                if (distance < 0) {
                    clearInterval(countdownInterval);
                    onDeckEtaDisplayEl.textContent = 'SOON';
                    document.getElementById('light-green').classList.add('green');
                    return;
                }
                const minutes = Math.floor(distance / 60000);
                const seconds = Math.floor((distance % 60000) / 1000);
                onDeckEtaDisplayEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                if (minutes > 5) document.getElementById('light-red').classList.add('red');
                else if (minutes >= 1) document.getElementById('light-yellow').classList.add('yellow');
                else document.getElementById('light-green').classList.add('green');
            };
            update();
            countdownInterval = setInterval(update, 1000);
        }
        
        function setView(layout) {
            if (currentLayout === layout) return;
            currentLayout = layout;

            homeScreenView.classList.add('hidden');
            mainContainer.classList.add('hidden');
            videoOverlay.classList.add('hidden');
            mainContainer.classList.remove('flex-col');
            tokenContainer.className = '';
            youtubeContainer.className = '';

            if (layout !== 'local_video' && tvVideoPlayer.src) {
                tvVideoPlayer.pause();
                tvVideoPlayer.src = '';
            }
             if (layout !== 'split' && layout !== 'full_tv') {
                if (ytPlayer && typeof ytPlayer.destroy === 'function') {
                    ytPlayer.destroy();
                    ytPlayer = null;
                }
            }


            switch(layout) {
                case 'home':
                    homeScreenView.classList.remove('hidden');
                    break;
                case 'token_only':
                    mainContainer.classList.remove('hidden');
                    tokenContainer.className = 'w-full h-full overflow-hidden shrink-0 transition-all';
                    youtubeContainer.className = 'w-0 h-0 overflow-hidden shrink-0 transition-all';
                    break;
                case 'split':
                    mainContainer.classList.remove('hidden');
                    mainContainer.classList.add('flex-col');
                    tokenContainer.className = 'w-full h-1/2 overflow-hidden shrink-0 transition-all';
                    youtubeContainer.className = 'w-full h-1/2 bg-black overflow-hidden shrink-0 transition-all';
                    break;
                case 'full_tv':
                    mainContainer.classList.remove('hidden');
                    tokenContainer.className = 'w-0 h-0 overflow-hidden shrink-0 transition-all';
                    youtubeContainer.className = 'w-full h-full bg-black overflow-hidden shrink-0 transition-all';
                    break;
                case 'local_video':
                    videoOverlay.classList.remove('hidden');
                    break;
            }
        }


        function updateDisplay(queue) {
            const servingCustomer = queue.find(c => c.status === 'Serving');
            const waitingCustomers = queue.filter(c => c.status === 'Waiting').sort((a,b) => (a.priority === 'high' && b.priority !== 'high') ? -1 : (b.priority === 'high' && a.priority !== 'high') ? 1 : a.tokenNumber - b.tokenNumber);

            const hasActiveCustomers = servingCustomer || waitingCustomers.length > 0;
            if (currentLayout === 'home' && hasActiveCustomers) {
                setView('token_only');
            } else if (currentLayout === 'token_only' && !hasActiveCustomers && !ytPlayer) {
                setView('home');
            }

            if (servingCustomer) {
                servingDisplayEl.classList.remove('hidden');
                noServingMessageEl.classList.add('hidden');
                if (servingTokenEl.textContent !== String(servingCustomer.tokenNumber)) {
                    servingTokenEl.textContent = servingCustomer.tokenNumber;
                    servingNameEl.textContent = escapeHtml(servingCustomer.customerName);
                    servingTokenEl.classList.add('highlight-update');
                    servingNameEl.classList.add('highlight-update');
                    setTimeout(() => {
                        servingTokenEl.classList.remove('highlight-update');
                        servingNameEl.classList.remove('highlight-update');
                    }, 1200);
                    if (lastServingToken !== servingCustomer.tokenNumber) {
                        speak(servingCustomer.tokenNumber, servingCustomer.customerName);
                        lastServingToken = servingCustomer.tokenNumber;
                    }
                }
            } else {
                servingDisplayEl.classList.add('hidden');
                noServingMessageEl.classList.remove('hidden');
                servingTokenEl.textContent = '-';
                servingNameEl.textContent = '-';
            }
            
            const onDeckCustomer = waitingCustomers[0];
            const nextUpCustomers = waitingCustomers.slice(1, 6);

            if (onDeckCustomer) {
                noOneWaitingMessageEl.classList.add('hidden');
                onDeckTokenEl.textContent = onDeckCustomer.tokenNumber;
                onDeckNameEl.textContent = escapeHtml(onDeckCustomer.customerName);
                updateCountdown(onDeckCustomer.eta);
            } else {
                onDeckTokenEl.textContent = '-';
                onDeckNameEl.textContent = '-';
                noOneWaitingMessageEl.classList.remove('hidden');
                updateCountdown(null);
            }
            
            nextUpListEl.innerHTML = nextUpCustomers.map(c => `<li class="flex justify-between items-center text-xl p-2 rounded-lg"><div class="flex items-center gap-4"><span class="font-bold text-2xl w-12 text-center">${c.tokenNumber}</span><span class="font-semibold">${escapeHtml(c.customerName)}</span></div></li>`).join('').repeat(2);
            nextUpListEl.classList.toggle('animate-scroll-up', nextUpCustomers.length > 3);

            const recentCustomers = queue.filter(c => ['Completed', 'Missed'].includes(c.status)).sort((a, b) => (b.servingTimestamp || b.timestamp) - (a.servingTimestamp || a.timestamp)).slice(0, 5);
            recentListEl.innerHTML = recentCustomers.map(c => `<li class="flex justify-between items-center text-lg p-2 rounded-lg"><span class="font-bold text-xl">${c.tokenNumber}</span><span>${escapeHtml(c.customerName)}</span><span class="text-sm ${c.status === 'Missed' ? 'text-orange-400' : 'text-gray-400'}">${c.status}</span></li>`).join('').repeat(2);
            recentListEl.classList.toggle('animate-scroll-up', recentCustomers.length > 3);

            const marqueeCustomers = waitingCustomers;
            if (servingCustomer) marqueeCustomers.unshift(servingCustomer);
            marqueeTextEl.innerHTML = (marqueeCustomers.map(c => `<span class="marquee-item"><span class="font-bold text-indigo-400">${c.tokenNumber}</span>: ${escapeHtml(c.customerName)} <span class="text-yellow-400">(${c.status})</span></span>`).join('') || `<span class="marquee-item">Welcome!</span>`).repeat(2);
            marqueeTextEl.classList.add('animate-marquee');
        }

        function setMuteState(shouldMute) {
            isMuted = shouldMute;
            document.getElementById('unmuted-icon').classList.toggle('hidden', isMuted);
            document.getElementById('muted-icon').classList.toggle('hidden', !isMuted);
            audioPlayer.muted = isMuted;
            if (ytPlayer && typeof ytPlayer.mute === 'function') {
                if (isMuted) ytPlayer.mute(); else ytPlayer.unMute();
            }
            if (isMuted) speechSynthesis.cancel();
        }

        window.onYouTubeIframeAPIReady = function() {
            isApiReady = true; 
        };

        function createYouTubePlayer(newState) {
            if (ytPlayer && typeof ytPlayer.destroy === 'function') {
                try {
                    ytPlayer.destroy();
                } catch (e) { console.warn("Error destroying previous player:", e); }
                ytPlayer = null;
            }
            
            if (!newState || !newState.videoIds || newState.videoIds.length === 0) {
                 setView(globalQueue.some(c => ['Serving', 'Waiting'].includes(c.status)) ? 'token_only' : 'home');
                 return;
            }

            const playerVars = { 
                'autoplay': 1, 'controls': 0, 'rel': 0, 'showinfo': 0, 
                'modestbranding': 1, 'loop': 0, 'mute': 1,
                'suggestedQuality': newState.quality || 'default',
                'playlist': newState.videoIds.join(',')
            };

            ytPlayer = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                playerVars: playerVars,
                events: {
                    'onReady': (event) => {
                        if (newState.currentIndex >= 0) {
                            event.target.playVideoAt(newState.currentIndex);
                        }
                        if (!isMuted) {
                            event.target.unMute();
                        }
                        event.target.setVolume(newState.volume || 80);
                    },
                    'onStateChange': (event) => {
                         if (event.data === YT.PlayerState.ENDED) {
                             const state = currentYtState;
                             if (state.repeatMode === 'one') {
                                 event.target.seekTo(0);
                             } else if (state.repeatMode === 'playlist') {
                                 // The playlist parameter in playerVars handles this automatically
                             } else {
                                 // If not repeating and it's the last video, consider stopping.
                                 const currentIdx = event.target.getPlaylistIndex();
                                 const playlistSize = event.target.getPlaylist()?.length || 0;
                                 if (currentIdx === playlistSize - 1) {
                                     // This was the last video. The reception panel will decide what to do next.
                                 }
                             }
                         }
                    }
                }
            });
            currentYtState = JSON.parse(JSON.stringify(newState)); // Deep copy
        }

        function syncYouTubePlayer(newState) {
            if (!isApiReady || !newState) return;
        
            const hasContent = (newState.videoIds && newState.videoIds.length > 0);
        
            // --- Player Creation / Destruction Logic ---
            if (!ytPlayer && hasContent) {
                createYouTubePlayer(newState);
                return;
            }
            if (ytPlayer && !hasContent) {
                if(typeof ytPlayer.destroy === 'function') ytPlayer.destroy();
                ytPlayer = null;
                currentYtState = {};
                setView(globalQueue.some(c => ['Serving', 'Waiting'].includes(c.status)) ? 'token_only' : 'home');
                return;
            }
            if (!ytPlayer) return;
        
            // --- Player Update Logic ---
            try {
                const newPlaylistIds = newState.videoIds || [];
                const oldPlaylistIds = currentYtState.videoIds || [];
        
                const playlistChanged = JSON.stringify(newPlaylistIds) !== JSON.stringify(oldPlaylistIds);
        
                if (playlistChanged) {
                    const playerState = ytPlayer.getPlayerState();
                    const isPlaying = playerState === YT.PlayerState.PLAYING || playerState === YT.PlayerState.BUFFERING;
                    // Check if we are just appending videos to the playlist
                    const isAppending = newPlaylistIds.length > oldPlaylistIds.length && 
                                        newPlaylistIds.slice(0, oldPlaylistIds.length).every((v, i) => v === oldPlaylistIds[i]);
                    
                    if (isPlaying && isAppending) {
                        // To avoid interruption, we reload the playlist but continue from the current video's time
                        const currentTime = ytPlayer.getCurrentTime();
                        const currentPlaylistIndexOnPlayer = ytPlayer.getPlaylistIndex();

                        // Only seek if the currently playing video is the one we expect.
                        // If the user manually changed video on the TV, we respect the reception panel's index.
                        if (currentPlaylistIndexOnPlayer === currentYtState.currentIndex) {
                            ytPlayer.loadPlaylist(newPlaylistIds, currentYtState.currentIndex, currentTime);
                        } else {
                            ytPlayer.loadPlaylist(newPlaylistIds, newState.currentIndex);
                        }
                    } else {
                        // For any other change (remove, reorder, new playlist), load it fresh.
                        ytPlayer.loadPlaylist(newPlaylistIds, newState.currentIndex);
                    }
                } else if (newState.currentIndex !== currentYtState.currentIndex) {
                    // If only the index changed within the same playlist, just play that video
                    ytPlayer.playVideoAt(newState.currentIndex);
                }
        
                // Sync Play/Pause state
                const playerStatus = ytPlayer.getPlayerState();
                if (newState.isPlaying && playerStatus !== YT.PlayerState.PLAYING && playerStatus !== YT.PlayerState.BUFFERING) {
                    ytPlayer.playVideo();
                } else if (!newState.isPlaying && playerStatus === YT.PlayerState.PLAYING) {
                    ytPlayer.pauseVideo();
                }
        
                // Sync Volume
                if (newState.volume !== currentYtState.volume && ytPlayer.getVolume() !== newState.volume) {
                    ytPlayer.setVolume(newState.volume);
                }
        
                // Sync Quality
                if (newState.quality !== currentYtState.quality) {
                     ytPlayer.setPlaybackQuality(newState.quality);
                }
                
            } catch (e) {
                console.error("Error syncing YT Player. Re-creating on next update.", e);
                if(ytPlayer && typeof ytPlayer.destroy === 'function') ytPlayer.destroy();
                ytPlayer = null;
            }
        
            currentYtState = JSON.parse(JSON.stringify(newState)); // Update state cache
        }


        document.addEventListener('DOMContentLoaded', () => {
            try {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                audioPlayer = document.getElementById('music-player');
                audioPlayer.volume = 0.8;
                document.getElementById('mute-btn').addEventListener('click', () => setMuteState(!isMuted));

                clockInterval = setInterval(() => {
                    if(clockEl) clockEl.textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
                }, 1000);
                
                const today = getTodayDateString();
                const queueRef = db.ref(`queues/${today}`);
                const mediaRef = db.ref(`mediaControls/${today}`);
                const smartTvControlsRef = db.ref(`smartTvControls/${today}`);
                const videoPlayerRef = db.ref(`videoPlayer/${today}`);

                db.ref('.info/serverTimeOffset').on('value', (snap) => {
                    serverTimeOffset = snap.val() || 0;
                    queueRef.on('value', (snapshot) => {
                        const data = snapshot.val() || {};
                        globalQueue = Object.keys(data).map(key => ({ key, ...data[key] }));
                        updateDisplay(globalQueue);
                    });
                });
                
                // Fetch initial state first, then listen for changes
                smartTvControlsRef.once('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data && isApiReady) {
                        lastSmartTvCommandTimestamp = data.timestamp || 0;
                        if (data.command === 'set_layout' && data.layout) setView(data.layout);
                        if (data.state) syncYouTubePlayer(data.state);
                    }

                    smartTvControlsRef.on('value', (snapshot) => {
                        if (!snapshot.exists()) return;
                        const data = snapshot.val();
                        if (data && typeof data === 'object' && data.timestamp && data.timestamp > lastSmartTvCommandTimestamp) {
                            lastSmartTvCommandTimestamp = data.timestamp;
                            switch (data.command) {
                                case 'set_layout':
                                    if (data.layout) setView(data.layout);
                                    break;
                                case 'update_player_state':
                                    if (data.state) syncYouTubePlayer(data.state);
                                    break;
                            }
                        }
                    });
                });
                
                 videoPlayerRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (!data || !data.command) return;
                    setView('local_video');
                    if (data.videoUrl && tvVideoPlayer.src !== data.videoUrl) {
                        tvVideoPlayer.src = data.videoUrl;
                    }
                    if (data.command === 'play') tvVideoPlayer.play();
                });

                mediaRef.on('value', (snapshot) => {
                    if (!snapshot.exists()) return;
                    const data = snapshot.val();
                    if (typeof data.volume === 'number' && audioPlayer.volume !== data.volume) audioPlayer.volume = data.volume;
                    if (data.timestamp && data.timestamp > lastMediaCommandTimestamp) {
                        lastMediaCommandTimestamp = data.timestamp;
                        if (data.trackUrl && audioPlayer.src !== data.trackUrl) audioPlayer.src = data.trackUrl;
                        if (data.command === 'play' && audioPlayer.src && !isMuted) audioPlayer.play().catch(e => {});
                        else if (data.command === 'pause' || data.command === 'stop') audioPlayer.pause();
                    }
                });

            } catch (e) {
                console.error("Initialization failed:", e);
                document.body.innerHTML = `<div class="p-8 text-center text-red-500"><h1>Error</h1><p>The application could not be initialized.</p></div>`;
            }
        });
    </script>
